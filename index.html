<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>رفيق الحفظ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f0e6;--card:#fffdf8;--ink:#1c2a25;--muted:#6a7871;--line:#e4dac8;
  --green:#1d6a50;--green2:#2c8a69;--soft:#e2eee7;--gold:#a87a26;--goldsoft:#f5e9d0;
  --danger:#b0463a;--shadow:0 1px 2px rgba(40,30,10,.06),0 4px 14px rgba(40,30,10,.05);
  --qfs:27px;
}
@media (prefers-color-scheme:light){
  html[data-theme="blue"]{--green:#1f5a8a;--green2:#2f7bbd;--soft:#e1ecf6;--bg:#f2f4f7;--card:#fdfeff;--line:#dbe2ea}
  html[data-theme="maroon"]{--green:#7a2e3b;--green2:#a3485a;--soft:#f4e4e6;--bg:#f6f0ec;--card:#fffcfa;--line:#e7d9d3}
}
@media (prefers-color-scheme:dark){
  html[data-theme="blue"]{--green:#6aa9e0;--green2:#8cc0ec;--soft:#1a2c3d;--bg:#0e141b;--card:#151e28;--line:#243242}
  html[data-theme="maroon"]{--green:#e08a99;--green2:#eba5b1;--soft:#3a1f25;--bg:#161011;--card:#211719;--line:#3a2a2d}
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1614;--card:#17211e;--ink:#e9eee9;--muted:#98a69f;--line:#26332f;
  --green:#56b993;--green2:#6fcaa6;--soft:#1b3329;--gold:#d8aa55;--goldsoft:#352c1b;--danger:#e0786b;
  --shadow:none;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;font-size:16px;line-height:1.6}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--green)}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom))}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 2px 14px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;border-radius:12px;background:var(--green);display:grid;place-items:center;color:#fff}
.brand h1{font-size:19px;margin:0;font-weight:700}
.brand small{display:block;color:var(--muted);font-size:12.5px;font-weight:400;margin-top:-2px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--goldsoft);color:var(--gold);border-radius:999px;padding:4px 11px;font-size:13.5px;font-weight:600;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h2{font-size:16.5px;margin:0 0 2px;display:flex;align-items:center;gap:8px}
.card .sub{color:var(--muted);font-size:13.5px;margin:0}
.tag{font-size:12px;font-weight:600;border-radius:8px;padding:2px 8px;background:var(--soft);color:var(--green)}
.tag.gold{background:var(--goldsoft);color:var(--gold)}
.lesson{font-family:"Amiri Quran",serif;font-size:21px;line-height:1.9;margin:10px 0 4px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:600;font-size:15px;background:var(--soft);color:var(--green)}
.btn.primary{background:var(--green);color:#fff}
@media (prefers-color-scheme:dark){.btn.primary{color:#0f1614}}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.small{padding:7px 12px;font-size:13.5px;border-radius:10px}
.btn.block{width:100%;padding:14px}
.btn.danger{background:transparent;border:1px solid var(--danger);color:var(--danger)}
.btn:disabled{opacity:.5}
.done-line{display:flex;align-items:center;gap:8px;color:var(--green);font-weight:600;margin-top:10px}
.muted{color:var(--muted)}
.banner{border-radius:14px;padding:12px 14px;background:var(--goldsoft);color:var(--ink);margin-bottom:12px;font-size:14.5px}
.tip{border-inline-start:3px solid var(--gold);padding:2px 12px;margin:0;font-size:14.5px}
/* nav */
nav.tabs{position:fixed;inset-inline:0;bottom:0;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:20}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{background:none;border:0;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted);font-weight:500}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--green);font-weight:700}
/* read */
.toolbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 10px;margin:0 0 6px;display:flex;flex-direction:column;gap:8px}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:9px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--green);color:#fff}
@media (prefers-color-scheme:dark){.seg button.on{color:#0f1614}}
.steps{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.steps span{flex:none;font-size:12.5px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--muted)}
.steps b{color:var(--green)}
.surah-head{text-align:center;margin:18px 0 8px}
.surah-head .name{display:inline-block;border:1px solid var(--gold);color:var(--gold);border-radius:999px;padding:3px 22px;font-weight:700;font-size:15px}
.basmala{font-family:"Amiri Quran",serif;text-align:center;font-size:calc(var(--qfs) - 2px);margin:8px 0 4px}
.page-div{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12.5px;margin:14px 0 6px}
.page-div::before,.page-div::after{content:"";flex:1;height:1px;background:var(--line)}
.ayah{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px 10px;margin-bottom:10px;user-select:none;transition:border-color .2s,background .2s}
.ayah.done{border-color:var(--green2);background:color-mix(in srgb,var(--soft) 55%,var(--card))}
.ayah .t{font-family:"Amiri Quran",serif;font-size:var(--qfs);line-height:2.15;text-align:justify}
.ayah .num{font-family:"Amiri Quran",serif;color:var(--gold);font-size:calc(var(--qfs) - 4px);margin-inline-start:4px;white-space:nowrap}
.ayah .meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px;font-size:13px;color:var(--muted)}
.bar{flex:1;height:5px;background:var(--line);border-radius:5px;overflow:hidden;max-width:140px}
.bar i{display:block;height:100%;background:var(--green2);width:0;transition:width .2s}
.w.h{color:transparent;background:var(--line);border-radius:8px;text-shadow:none}
.w{transition:color .15s}
.actionbar{position:fixed;inset-inline:0;bottom:calc(62px + env(safe-area-inset-bottom));z-index:15;padding:8px 16px}
.actionbar .in{max-width:528px;margin:0 auto}
.listen{display:flex;gap:6px;flex-wrap:wrap;font-size:13.5px}
.listen a{text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:5px 10px;color:var(--green);font-weight:600}
/* progress */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow)}
.stat .v{font-size:24px;font-weight:700;line-height:1.2}
.stat .l{font-size:13px;color:var(--muted)}
.big-bar{height:10px;border-radius:10px;background:var(--line);overflow:hidden;margin:8px 0 2px}
.big-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--green2))}
.juz{display:flex;align-items:flex-start;gap:8px;margin-bottom:7px}
.juz{align-items:center}
.juz .jl{flex:none;width:52px;font-size:12px;color:var(--muted);white-space:nowrap}
.juz .sq{display:grid;grid-template-columns:repeat(23,1fr);gap:2px;flex:1}
.sq button{aspect-ratio:1;width:100%;border:0;padding:0;border-radius:2.5px;background:var(--line);min-width:0}
.sq button.p{background:color-mix(in srgb,var(--green2) 40%,var(--line))}
.sq button.m{background:var(--green)}
.sq button.wk{background:var(--gold)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:4px 0 12px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}
/* plan */
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.opt{border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:10px 12px;text-align:start}
.opt b{display:block;font-size:15.5px}
.opt span{display:block;font-size:12.5px;color:var(--muted);line-height:1.5}
.opt.on{border-color:var(--green);background:var(--soft)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px}
.days button{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:8px 0;font-size:12.5px;font-weight:600}
.days button.on{border-color:var(--green);background:var(--green);color:#fff}
@media (prefers-color-scheme:dark){.days button.on{color:#0f1614}}
select{font:inherit;width:100%;margin-top:10px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
table.cmp{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
table.cmp th,table.cmp td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:start}
table.cmp th{color:var(--muted);font-weight:500;font-size:12.5px}
table.cmp tr.on td{color:var(--green);font-weight:700}
.summary{background:var(--soft);border-radius:14px;padding:12px 14px;margin-top:12px;font-size:15px}
.summary b{color:var(--green)}
/* modal & toast */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center;z-index:50}
.modal.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:85vh;overflow:auto}
.sheet h3{margin:0 0 6px;font-size:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:calc(140px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14.5px;opacity:0;transition:.25s;z-index:60;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.celebrate{text-align:center;padding:10px 0}
.celebrate .e{font-size:54px}
.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.pick button{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:8px 4px;font-size:13px}
.pick button.on{background:var(--green);border-color:var(--green);color:#fff}
.loading{display:grid;place-items:center;min-height:60vh;color:var(--muted);text-align:center}
.foot{font-size:12px;color:var(--muted);text-align:center;margin:18px 0 4px}
.pager{display:flex;justify-content:space-between;align-items:center;margin:4px 0 10px}
.w.ok{color:inherit}
.w.miss{color:var(--danger);text-decoration:underline wavy;text-decoration-thickness:1px;text-underline-offset:8px}
.w.hint{color:var(--gold)}
.showtext .w.h{color:inherit;background:none;opacity:.35}
.voicebox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:6px 0 12px}
.mic{width:100%;border:0;border-radius:14px;padding:13px;font-weight:700;font-size:16px;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;gap:8px}
.mic.on{background:var(--danger)}
.mic .dot{width:10px;height:10px;border-radius:50%;background:#fff;opacity:.9}
.mic.on .dot{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
.partial{min-height:22px;color:var(--muted);font-size:13.5px;margin-top:6px}
.vstats{display:flex;gap:12px;flex-wrap:wrap;font-size:13.5px;margin-top:6px}
.vstats b{font-weight:700}
.ayah .lis{font-size:12.5px;text-decoration:none;color:var(--green);font-weight:600;white-space:nowrap}
.field{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.field label{font-size:12.5px;color:var(--muted);display:block;margin-top:10px}
.field select{margin-top:4px}
.w.khafi{border-bottom:2px dotted var(--gold)}
.w.fixed{color:var(--gold)}
.w.dim{opacity:.4}
.w.seen{opacity:.55}
.w.skip{color:var(--danger);text-decoration:line-through;text-decoration-thickness:1px}
.w[data-aw]{cursor:pointer}
.level{height:4px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:8px}
.level i{display:block;height:100%;width:0;background:var(--green2);transition:width .08s}
.acc-status{font-size:13.5px;margin-top:8px;min-height:20px}
.else-ayah{margin-top:8px;padding:8px 10px;border-radius:12px;background:var(--soft,rgba(0,0,0,.04));font-family:"Amiri Quran",serif;font-size:20px;line-height:1.9}
.else-ayah .num{color:var(--gold);font-size:16px}
#accElse,#voiceElse{max-height:38vh;overflow:auto}
.acc-status.bad{color:var(--danger);font-weight:600}
.chiprow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.notes-list{margin:8px 0 0;padding:0;list-style:none}
.notes-list li{padding:8px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.notes-list li b{font-family:"Amiri Quran",serif;font-size:19px;font-weight:400}
.sev-jali{color:var(--danger)} .sev-khafi{color:var(--gold)}
.swatches{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.swatch{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13.5px;font-weight:600}
.swatch i{width:34px;height:34px;border-radius:50%;display:block}
.swatch.on{border-color:var(--ink)}
.ayah.playing{border-color:var(--gold);box-shadow:0 0 0 2px color-mix(in srgb,var(--gold) 35%,transparent)}
.player{display:flex;gap:6px;align-items:center}
.player .play{flex:none;min-width:112px;border:0;border-radius:12px;padding:10px 14px;font-weight:700;background:var(--gold);color:#fff}
.player select{margin:0;padding:8px 10px;flex:1;min-width:0}
.ayah .playone{border:0;background:none;padding:0;font-size:12.5px;color:var(--green);font-weight:600;white-space:nowrap}
.hubbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.hubbtns .btn,.hubbtns a.btn{text-align:center;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:6px}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="loading"><div><div class="logo" style="margin:0 auto 12px;width:52px;height:52px">📖</div>جاري تحميل المصحف…</div></div></div>
<nav class="tabs" id="tabs" hidden><div class="in">
  <button data-go="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>اليوم</button>
  <button data-go="read"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6c-2-1.5-5-2-8-1.5v14c3-.5 6 0 8 1.5 2-1.5 5-2 8-1.5v-14c-3-.5-6 0-8 1.5z"/><path d="M12 6v14"/></svg>الحفظ</button>
  <button data-go="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>التقدم</button>
  <button data-go="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>الخطة</button>
</div></nav>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
const APP_VERSION="1.6.0"; // keep in sync with CHANGELOG.md and the GitHub commit
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const AR = n => String(n).replace(/\d/g, d => "٠١٢٣٤٥٦٧٨٩"[d]);
const DAYS = ["الأحد","الإثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
const DAYS_SHORT = ["أحد","إثنين","ثلاثاء","أربعاء","خميس","جمعة","سبت"];
const AMOUNTS = [
  {v:.25, name:"ربع صفحة", lines:"3 إلى 4 أسطر", time:"20 إلى 30 دقيقة"},
  {v:.5,  name:"نص صفحة", lines:"7 إلى 8 أسطر", time:"40 إلى 45 دقيقة"},
  {v:1,   name:"صفحة", lines:"15 سطر", time:"حوالي ساعة"},
  {v:2,   name:"صفحتين", lines:"30 سطر", time:"ساعة ونص إلى ساعتين"}
];
const REVIEW = {0.25:[5,5], 0.5:[10,10], 1:[20,20], 2:[20,20]}; // [near pages, far pages per day]
const TIPS = [
  "اسمع المقطع من قارئ واحد ثابت قبل لا تبدأ، الأذن تحفظ قبل العين.",
  "احفظ من نفس المصحف دايماً، عشان تثبت صورة الصفحة في ذهنك.",
  "أحسن وقت للحفظ الجديد بعد الفجر، والذهن صافي.",
  "اقرأ اللي حفظته اليوم في صلاتك، هذي أقوى مراجعة.",
  "لا تضيف حفظ جديد وأنت ما راجعت، المراجعة هي اللي تثبّت.",
  "اقرأ معنى الآيات قبل الحفظ، الفهم يسهّل الحفظ وايد.",
  "سمّع لأحد ولو مرة في الأسبوع، يكشف لك أخطاء ما تنتبه لها.",
  "اربط آخر آية في درسك بأول آية في درس بكرة.",
  "الاستمرار أهم من الكمية، ربع صفحة كل يوم أحسن من صفحتين وتنقطع.",
  "إذا تعبت، قلل الكمية ولا توقف. المهم ما تنقطع السلسلة."
];
const fmtDate = d => new Intl.DateTimeFormat("ar-u-nu-latn",{day:"numeric",month:"long",year:"numeric"}).format(d);
const fmtDay = d => new Intl.DateTimeFormat("ar-u-nu-latn",{weekday:"long",day:"numeric",month:"long"}).format(d);
const keyOf = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const round1 = x => Math.round(x*10)/10;
const fmtNum = x => { const r = round1(x); return Number.isInteger(r) ? String(r) : r.toFixed(1); };
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2600); }
function openSheet(html){ $("#sheet").innerHTML=html; $("#modal").classList.add("show"); }
function closeSheet(){ $("#modal").classList.remove("show"); }
$("#modal").addEventListener("click", e => { if (e.target.id==="modal") closeSheet(); });

/* ---------- Quran data ---------- */
let SUR=[], A=[], LEN=[], N=0, AVG=0, TOTAL=0, PAGE=[], PAGELEN=[], JUZP=[], SFIRST=[];
let BASMALA="";
function prepare(q){
  SUR=q.surahs; A=q.ayahs; N=A.length;
  PAGE=Array.from({length:605},()=>[]); PAGELEN=new Array(605).fill(0);
  JUZP=Array.from({length:31},()=>[999,0]); SFIRST=new Array(115).fill(-1);
  for(let i=0;i<N;i++){
    const [s,a,p,j,t]=A[i]; const L=t.replace(/\s/g,"").length; LEN[i]=L; TOTAL+=L;
    PAGE[p].push(i); PAGELEN[p]+=L;

let saving=false, dirty=false, saveT=null;

}
async function flush(retry){
  if(store.mode!=="db") return;

  saving=true;

    if(S) await store.ref.set(JSON.parse(JSON.stringify(S)));

    if(c!=="unavailable"){ store.mode="local"; store.note="تقدمك محفوظ في هالجهاز."; store.warn="ما قدرت أحفظ في حسابك، فتقدمك محفوظ في هالجهاز."; toast("انحفظ التقدم في هالجهاز"); }

/* ---------- plan logic ---------- */
let seqCache={k:"",seq:null};
function seq(){
  const k=S.order+":"+S.start; if(seqCache.k===k) return seqCache.seq;
  let list=[]; for(let s=1;s<=114;s++) list.push(s); if(S.order==="back") list.reverse();
  const at=Math.max(0,list.indexOf(S.start)); list=list.slice(at).concat(list.slice(0,at));
  const out=[]; for(const s of list){ const f=SFIRST[s]; for(let a=0;a<SUR[s-1][1];a++) out.push(f+a); }
  seqCache={k,seq:out}; return out;
}
function nextLesson(){
  const target=S.amount*AVG; const out=[]; let acc=0, cur=null, extend=null;
  for(const i of seq()){
    if(MEM[i]) continue;
    const s=A[i][0];
    if(out.length){
      if(extend!==null){ if(s!==extend) break; }
      else if(acc>=0.9*target){
        if(s===cur){ let rem=0; for(let j=i;j<N&&A[j][0]===s;j++) if(!MEM[j]) rem+=LEN[j];
          if(rem<0.3*target) extend=s; else break; }
        else break;
      } else if(s!==cur && acc>=0.6*target) break;
    }
    out.push(i); acc+=LEN[i]; cur=s;
  }
  return out;
}
function memChars(){ let c=0; for(let i=0;i<N;i++) if(MEM[i]) c+=LEN[i]; return c; }
function pageState(p){ let m=0; for(const i of PAGE[p]) if(MEM[i]) m++; return m===0?0:(m===PAGE[p].length?2:1); }
function memPages(){ const r=[]; for(let p=1;p<=604;p++) if(pageState(p)) r.push(p); return r; }
function isActiveDay(d){ return S.days.includes(d.getDay()); }
function activePerMonth(daysCount){ return daysCount*52/12; }
function finishDate(amount, fromChars){
  if(!S.days.length) return null;
  const remaining=TOTAL-fromChars; if(remaining<=0) return new Date();
  let need=Math.ceil(remaining/(amount*AVG)); let d=new Date();
  const tk=keyOf(d); if(S.log[tk]&&S.log[tk].n) d=addDays(d,1);
  let guard=0; while(guard++<20000){ if(isActiveDay(d)){ need--; if(need<=0) return d; } d=addDays(d,1); }
  return null;
}
function durationText(d){
  if(!d) return "";
  const months=Math.max(0,Math.round((d-new Date())/(1000*60*60*24*30.44)));
  const y=Math.floor(months/12), m=months%12;
  const yt = y===0?"":(y===1?"سنة":y===2?"سنتين":y<=10?y+" سنوات":y+" سنة");
  const mt = m===0?"":(m===1?"شهر":m===2?"شهرين":m<=10?m+" شهور":m+" شهر");
  if(!yt && !mt) return "أقل من شهر";
  return [yt,mt].filter(Boolean).join(" و");
}
function streak(){
  let d=new Date(); let k=keyOf(d); const done=x=>{const l=S.log[keyOf(x)]; return l&&(l.n||l.r||l.f);};
  if(!done(d)) d=addDays(d,-1);
  let c=0, g=0;
  while(g++<3000){ if(done(d)) c++; else if(!isActiveDay(d)){ /* rest day, skip */ } else break; d=addDays(d,-1);
    if(keyOf(d)<S.started) break; }
  return c;
}
function monthPages(){ const m=keyOf(new Date()).slice(0,7); let c=0; for(const k in S.log) if(k.startsWith(m)) c+=S.log[k].n||0; return c/AVG; }
function nearPages(){
  const [nearN]=REVIEW[S.amount]||[10]; const pages=[]; const seen=new Set();
  for(let h=S.hist.length-1;h>=0 && pages.length<nearN;h--){
    const idx=[]; for(const [a,b] of S.hist[h].r) for(let i=a;i<=b;i++) idx.push(i);
    for(let x=idx.length-1;x>=0;x--){ const p=A[idx[x]][2]; if(!seen.has(p) && pageState(p)){ seen.add(p); pages.push(p); if(pages.length>=nearN) break; } }
  }
  return pages.sort((a,b)=>a-b);
}
function farPages(){
  const [,farN]=REVIEW[S.amount]||[10,10]; const near=new Set(nearPages());
  const all=memPages().filter(p=>!near.has(p)); if(!all.length) return [];
  const start=S.farPos%all.length; const out=[];
  for(let k=0;k<Math.min(farN,all.length);k++) out.push(all[(start+k)%all.length]);
  return out.sort((a,b)=>a-b);
}
function weakPages(){ return Object.entries(S.weak).filter(([,c])=>c>0).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([p])=>+p).sort((a,b)=>a-b); }
function toRanges(idx){ const s=[...idx].sort((a,b)=>a-b); const r=[]; for(const i of s){ if(r.length&&r[r.length-1][1]===i-1) r[r.length-1][1]=i; else r.push([i,i]); } return r; }
function describeIdx(idx){
  const groups=[]; for(const i of idx){ const [s,a]=A[i]; const g=groups[groups.length-1];
    if(g&&g.s===s&&g.b===a-1) g.b=a; else groups.push({s,a,b:a}); }
  return groups.map(g=>"سورة "+surahName(g.s)+" "+(g.a===g.b?AR(g.a):AR(g.a)+"–"+AR(g.b)));
}
function describePages(pages){
  if(!pages.length) return "";
  const r=[]; for(const p of pages){ if(r.length&&r[r.length-1][1]===p-1) r[r.length-1][1]=p; else r.push([p,p]); }
  const pr=r.map(([a,b])=>a===b?String(a):a+"–"+b).join("، ");
  const ss=[]; for(const p of pages) for(const i of PAGE[p]){ const n=surahName(A[i][0]); if(!ss.includes(n)) ss.push(n); }
  const sn=ss.length>3? ss.slice(0,3).join("، ")+" وغيرها" : ss.join("، ");
  return {pr, sn, count:pages.length};

let DICT=null, DICT_READY=false;
const VOICE={key:"", T:[], start:{}, st:[], p:0, finals:"", partial:"", hints:new Set(), state:"idle", showText:false, ended:false};
const SHOW=()=>!S||S.check!=="fix"; // show only (the default): the ayah you read appears, no mistakes marked
function ayahLabel(g1,g2){ const [s,a]=A[g1], b=A[g2][1]; return "سورة "+surahName(s)+"، "+(g2===g1||A[g2][0]!==s?"آية "+AR(a):"آية "+AR(a)+"–"+AR(b)); }
function elseHTML(g1,g2,title){ let h=title===false?"":`<p class="sub" style="margin-top:8px">قريت من مكان ثاني: ${ayahLabel(g1,g2)}</p>`; for(let g=g1;g<=g2&&g<N;g++) h+=`<div class="else-ayah">${A[g][4]} <span class="num">﴿${AR(A[g][1])}﴾</span></div>`; return h; }
function norm(w){ return w.replace(/[\u0610-\u061A\u064B-\u065F\u0670\u06D6-\u06ED\u08D3-\u08FF\u0640]/g,"").replace(/[ٱأإآا]/g,"").replace(/ى/g,"ي").replace(/ة/g,"ه").replace(/ؤ/g,"و").replace(/ئ/g,"ي").replace(/ء/g,"").replace(/[^\u0621-\u064A]/g,""); }
function lev(a,b){ if(a===b) return 0; const m=a.length,n=b.length; if(!m) return n; if(!n) return m; let prev=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){ const cur=[i]; for(let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1)); prev=cur; } return prev[n]; }
function sim(a,b){ if(!a||!b) return 0; if(a===b) return 1; if(Math.min(a.length,b.length)<=2) return 0; return 1-lev(a,b)/Math.max(a.length,b.length); }
function voicePrepare(idx){
  const key=idx[0]+":"+idx[idx.length-1]+":"+idx.length; if(VOICE.key===key) return;
  VOICE.key=key; VOICE.T=[]; VOICE.start={}; VOICE.finals=""; VOICE.partial=""; VOICE.hints=new Set(); VOICE.ended=false; VOICE.base=0; VOICE.skipSpoken=0; VOICE.elseHTML=""; VOICE.elseFrom=null; VOICE.elseTried=null;
  for(const i of idx){ VOICE.start[i]=VOICE.T.length; for(const w of A[i][4].split(/\s+/)) VOICE.T.push({i, n:norm(w)}); }
  VOICE.st=new Array(VOICE.T.length).fill(0); VOICE.p=0;
}
function align(text){
  const T=VOICE.T, st=new Array(T.length).fill(0), H=VOICE.hints;
  let sp=text.split(/\s+/).map(norm).filter(Boolean); let p=0;
  if(VOICE.skipSpoken) sp=sp.slice(VOICE.skipSpoken);
  else { const ex=stripExtras(sp); const drop=ex.nIst+(ex.nBas&&!expectsBasmala()?ex.nBas:0); if(drop) sp=sp.slice(drop); } // the isti'adha / basmala before the passage
  const skipHints=()=>{ while(p<T.length && H.has(p)){ st[p]=3; p++; } };
  const show=SHOW(), stay=!show && S && S.stay!==false;
  let tail=0; // spoken words after the last one that matched (show only: reading somewhere else)
  p=VOICE.base||0; for(let k=0;k<p;k++) st[k]=6;
  for(let j=0;j<sp.length;j++){
    skipHints(); if(p>=T.length) break;
    let best=-1, two=false, eat=false;
    for(let d=0; d<25 && p+d<T.length; d++){
      const k=p+d, tn=T[k].n, thr=d<=4?0.7:0.85;
      if(tn.length<=2 && d>2) continue;
      if(sim(sp[j],tn)>=thr){ best=k; break; }
      if(k+1<T.length && sim(sp[j],tn+T[k+1].n)>=Math.max(thr,0.8)){ best=k; two=true; break; }
      if(j+1<sp.length && sim(sp[j]+sp[j+1],tn)>=Math.max(thr,0.8)){ best=k; eat=true; break; }
    }
    if(best<0){ if(sp[j].length>1) tail++; continue; }
    tail=0;
    if(stay && best>p){ if(!H.has(p)) st[p]=2; continue; } // stay: a skipped word stops you there until you say it
    for(let m=p;m<best;m++) st[m]=H.has(m)?3:show?(best-p<=3?1:0):2; // show only: a word or three the speech-to-text missed
    st[best]=st[best]===2?4:1; p=best+1; if(two){ st[best+1]=1; p=best+2; } if(eat) j++;
  }
  skipHints();
  return {st,p,tail};
}

function voiceUpdate(){
  if(VIEW!=="read"||MODE!=="voice") return;

  const old=VOICE.st; VOICE.st=st; VOICE.p=p;
  const cls=["w h","w ok","w miss","w hint","w fixed","w skip","w dim"];
  for(let k=0;k<st.length;k++){ if(st[k]!==old[k] || VOICE._fresh!==VOICE.key){ const el=document.querySelector('[data-w="'+k+'"]'); if(el) el.className=cls[st[k]]; } }
  VOICE._fresh=VOICE.key;
  const ok=st.filter(x=>x===1).length, miss=st.filter(x=>x===2).length, hint=st.filter(x=>x===3).length, left=st.length-p;
  const vs=$("#vstats"); if(vs) vs.innerHTML=SHOW()?`<span style="color:var(--green)">قريت <b>${ok}</b> كلمة</span><span class="muted">باقي <b>${left}</b> كلمة</span>`:`<span style="color:var(--green)">صح <b>${ok}</b></span><span style="color:var(--danger)">نسيت أو غلطت <b>${miss}</b></span><span style="color:var(--gold)">تلميح <b>${hint}</b></span><span class="muted">باقي <b>${left}</b> كلمة</span>`;
  if(SHOW() && tail>=5 && VOICE.state==="listening") voiceElsewhere();
  else if(!tail && VOICE.elseHTML){ VOICE.elseHTML=""; const el=$("#voiceElse"); if(el) el.innerHTML=""; } // back in the passage
  const pe=$("#partial"); if(pe && VOICE.state!=="idle") pe.textContent=VOICE.partial||"…";
  // keep the next word in view while reciting
  if(VOICE.state==="listening"){ const nx=document.querySelector('[data-w="'+Math.min(p,st.length-1)+'"]'); if(nx){ const r=nx.getBoundingClientRect(); const tb=document.querySelector(".toolbar"); const top=tb?tb.getBoundingClientRect().bottom+10:120; if(r.bottom>innerHeight-150||r.top<top) nx.scrollIntoView({block:"center",behavior:"smooth"}); } }
  if(p>=st.length && st.length && VOICE.state==="listening"){ stopDict(); toast("ما شاء الله، خلصت التسميع ✓"); VOICE.ended=true; }
  const sum=$("#voiceSum");
  if(sum){
    if((VOICE.ended || (VOICE.state==="idle" && VOICE.finals)) && p>0 && SHOW()){
      const read=[...new Set(st.map((v,k)=>v===1||v===4?VOICE.T[k].i:-1).filter(x=>x>=0))];
      sum.innerHTML=`<div class="card"><h2>قريت</h2><p style="margin:6px 0 0;font-size:15px"><b style="color:var(--green)">${ok}</b> كلمة${read.length?" · "+describeIdx(read).join("، "):""}</p>
        <p class="sub" style="margin-top:10px;font-size:12px">هذا عرض بس بدون تصحيح. تقدر تشغّل تصحيح الأخطاء من ⚙️.</p></div>`;
    } else if((VOICE.ended || (VOICE.state==="idle" && VOICE.finals)) && p>0){
      const pct=Math.round(ok/Math.max(1,ok+miss+hint)*100);
      const bad=[...new Set(st.map((v,k)=>v===2?VOICE.T[k].i:-1).filter(x=>x>=0))];
      sum.innerHTML=`<div class="card"><h2>نتيجة التسميع</h2><p style="margin:6px 0 0;font-size:15px"><b style="color:var(--green)">${ok}</b> كلمة صح من ${ok+miss+hint} (${pct}٪)${left?` · ما وصلت لـ ${left} كلمة`:""}</p>
        ${bad.length?`<p class="sub" style="margin-top:6px">الآيات اللي فيها أخطاء: ${describeIdx(bad).join("، ")}</p><button class="btn small" style="margin-top:10px" data-act="voice-weak">سجّل صفحاتها للتثبيت</button>`:`<p class="sub" style="margin-top:6px">ما فيه أخطاء، الله يبارك فيك 🌟</p>`}

    } else sum.innerHTML="";

}

/* ----- word-level free start (Claude dictation / browser speech) ----- */
let WIDX=null;
let EXTRA_W=null;
function extraWords(){ if(!EXTRA_W) EXTRA_W={basmala:A[0][4].split(/\s+/).map(norm).filter(Boolean), istiatha:"أعوذ بالله من الشيطان الرجيم".split(/\s+/).map(norm).filter(Boolean)}; return EXTRA_W; }
/** spoken words (normalized) that open with the isti'adha and / or the basmala → how many words they take */
function stripExtras(sp){
  const E=extraWords(); let n=0, nIst=0, nBas=0;
  for(const k of ["istiatha","basmala"]){
    const w=E[k]; let m=0; for(let i=0;i<w.length&&n+i<sp.length;i++) if(sp[n+i]===w[i]||sim(sp[n+i],w[i])>=0.7) m++;
    if(m>=Math.max(3,w.length-1)){ const take=Math.min(w.length, sp.length-n); n+=take; if(k==="basmala") nBas=take; else nIst=take; }
  }
  return {n, nIst, nBas};
}
function expectsBasmala(){ const E=extraWords().basmala, T=VOICE.T, b=VOICE.base||0; let m=0; for(let i=0;i<E.length&&b+i<T.length;i++) if(T[b+i].n===E[i]) m++; return m>=E.length-1; }
function wordIndex(){
  if(!WIDX){ WIDX=new Map(); const words=[]; for(let i=0;i<N;i++){ const ws=A[i][4].split(/\s+/).map(norm); ws.forEach((w,k)=>words.push([i,k,w])); }

  return WIDX;
}
/** spoken words → where in the Quran they start (index into wordIndex().words), by votes of word pairs */
function wordVote(sp, filter){ const I=wordIndex(), votes=new Map(), firstJ=new Map();
  for(let j=0;j+1<sp.length;j++){ if(sp[j].length<2||sp[j+1].length<2) continue; const l=I.get(sp[j]+" "+sp[j+1]); if(!l) continue; for(const x of l){ const start=x-j; if(start<0||(filter&&!filter(start))) continue; votes.set(start,(votes.get(start)||0)+1); if(!firstJ.has(start)) firstJ.set(start,j); } }

/** show only: the last words said match nothing here; find them anywhere. A free start moves there, a set passage

let RELOCATING=false;
function voiceElsewhere(){
  if(RELOCATING) return;
  const words=VOICE.finals.trim().split(/\s+/); if(VOICE.elseFrom!=null && VOICE.elseFrom>words.length) VOICE.elseFrom=null;
  if(VOICE.elseTried===words.length) return; VOICE.elseTried=words.length; // once per new words
  const recent=words.slice(Math.max(VOICE.elseFrom||0, words.length-12)), sp=recent.map(norm);
  const r=wordVote(sp,null); if(r.best==null||r.bv<2||r.bv===r.second) return;
  const W=wordIndex().words, g=W[r.best+r.jmin][0], g2=W[Math.min(W.length-1,r.best+sp.length-1)][0];
  if(READ&&READ.free){ // a free start: carry on from there
    const from=recent.slice(r.jmin); VOICE.finals=from.join(" "); VOICE.elseFrom=null; VOICE.elseHTML="";
    RELOCATING=true; try{ freeFindWords(); } finally { RELOCATING=false; } VOICE.elseTried=from.length; return; }
  VOICE.elseFrom=words.length; // look only at what comes after this next time
  VOICE.elseHTML=elseHTML(g,Math.max(g,g2)); const el=$("#voiceElse"); if(el) el.innerHTML=VOICE.elseHTML;
}
function freeFindWords(){
  const all=VOICE.finals.split(/\s+/).map(norm).filter(Boolean);
  const ex=stripExtras(all), rest=all.slice(ex.n), pe=$("#partial");
  const longWords=rest.filter(x=>x.length>1).length;
  if(ex.n && longWords<2){ if(pe) pe.textContent=ex.nBas?"البسملة ✓ اقرأ أول السورة…":"الاستعاذة ✓ كمّل…"; return; }
  if(longWords<(ex.nBas?2:4)){ if(pe) pe.textContent="كمّل… ("+VOICE.finals.trim()+")"; return; }
  const sp=rest;
  const W=wordIndex().words;
  // after a basmala the reciter is starting a surah: only the first word of an ayah 1 (al-Fatiha: of 1:2) can be the start
  const opening=(x)=>{ const w=W[x]; return w && w[1]===0 && (A[w[0]][1]===1 ? w[0]!==0 : w[0]===1); };
  let r=ex.nBas?wordVote(sp,opening):null;
  if(!r||r.best==null||r.bv===r.second) r=wordVote(sp,null);
  const {best,bv,second}=r, minVotes=ex.nBas&&r.best!=null&&opening(r.best)?1:2;
  if(best==null || bv<minVotes || bv===second){ if(pe) pe.textContent=bv===second&&bv>=2?"هالمقطع يتكرر، كمّل شوي…":"ما عرفتها بعد، كمّل…"; return; }
  let [g,k]=W[best];
  const fatiha=ex.nBas && g===1 && k===0; // «بسم الله…» then «الحمد لله»: al-Fatiha from its first ayah, the basmala
  const first=fatiha?0:g;
  const list=[]; for(let i=first;i<N&&A[i][0]===A[first][0];i++) list.push(i);
  toast((ex.nBas&&(A[g][1]===1||fatiha)?"بداية سورة ":"عرفتها: سورة ")+surahName(A[first][0])+(ex.nBas&&(A[g][1]===1||fatiha)?"":"، آية "+AR(A[g][1])));
  READ={kind:"range", s:A[first][0], a:A[first][1], b:A[list[list.length-1]][1], free:true};
  const fin=VOICE.finals; VOICE.key=""; voicePrepare(list); VOICE.finals=fin;
  VOICE.base=fatiha?VOICE.start[0]:VOICE.start[g]+k;
  VOICE.skipSpoken=fatiha?ex.nIst:ex.n; render();
}

const PLAYER={audio:null, list:[], pos:0, rep:0, round:0, playing:false, single:null, src:0};
function playIdx(idx, opt){

  const list=[]; for(const i of idx){ const [s,a]=A[i]; if(a===1 && s!==1 && s!==9 && opt.single==null) list.push({i:0, bas:true, of:i}); list.push({i}); }

  if(!PLAYER.audio){ PLAYER.audio=new Audio(); PLAYER.audio.preload="auto";
    PLAYER.audio.addEventListener("ended", ()=>{ if(PLAYER.playing) advance(); });
    PLAYER.audio.addEventListener("error", ()=>{ if(!PLAYER.playing) return; const it=PLAYER.list[PLAYER.pos]; const urls=audioURLs(it.i);
      if(PLAYER.src+1<urls.length){ PLAYER.src++; PLAYER.audio.src=urls[PLAYER.src]; PLAYER.audio.play().catch(()=>{}); }
      else { stopAudio(); toast("ما قدرت أشغّل الصوت. تأكد من الإنترنت أو جرّب قارئ ثاني"); } });
  }

}
function playCurrent(){

  const a=PLAYER.audio; a.src=audioURLs(it.i)[0]; a.playbackRate=S.speed||1;
  a.play().catch(err=>{ if(err&&err.name==="NotAllowedError"){ stopAudio(); toast("اضغط زر التشغيل مرة ثانية"); } });
  markPlaying(it.bas?it.of:it.i); setPlayBtn();

function advance(){
  const it=PLAYER.list[PLAYER.pos];
  if(!it.bas){ PLAYER.rep++; if(PLAYER.rep < (S.arep||1)){ playCurrent(); return; } }
  PLAYER.rep=0; PLAYER.pos++;

  }

}

/* ----- browser speech recognition (own site only), shaped like Claude's dictation ----- */
function webSpeechAdapter(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(!SR) return null;
  const android=/Android/i.test(navigator.userAgent);
  let rec=null, want=false, state="idle", reason=null; const fH=[],pH=[],sH=[];
  const emit=(st,r)=>{ state=st; sH.forEach(h=>h(r?{state:st,reason:r}:{state:st})); };
  function make(){
    rec=new SR(); rec.lang="ar-SA"; rec.interimResults=true; rec.maxAlternatives=1; rec.continuous=!android;
    rec.onstart=()=>{ if(state!=="listening") emit("listening"); };
    rec.onresult=e=>{ let interim=""; for(let k=e.resultIndex;k<e.results.length;k++){ const r=e.results[k];
        if(r.isFinal){ const t=r[0].transcript.trim(); if(t) fH.forEach(h=>h({text:" "+t})); } else interim+=r[0].transcript; }
      pH.forEach(h=>h({text:interim})); };
    rec.onerror=e=>{ const c=e.error;
      if(c==="not-allowed"||c==="service-not-allowed"){ want=false; reason="not_granted"; }
      else if(c==="network"){ want=false; reason="upstream_error"; }
      else if(c==="language-not-supported"){ want=false; reason="unavailable"; } };
    rec.onend=()=>{ if(want){ try{ rec.start(); return; }catch(err){} } emit("idle", reason||"stopped"); reason=null; };
  }
  return {
    start(){ if(state!=="idle") return Promise.resolve(); want=true; reason=null; make(); emit("starting");
      try{ rec.start(); }catch(err){ want=false; emit("idle","upstream_error"); return Promise.reject({code:"upstream_error"}); }
      return Promise.resolve(); },
    stop(){ want=false; if(rec && state!=="idle"){ emit("finishing"); try{ rec.stop(); }catch(e){ emit("idle","stopped"); } } return Promise.resolve(); },
    active(){ return state!=="idle"; },
    onFinal(h){ fH.push(h); return ()=>{}; }, onPartial(h){ pH.push(h); return ()=>{}; }, onState(h){ sH.push(h); return ()=>{}; }
  };
}

  if(act==="mic"){ if(useAcc()) accMicClick(); else micClick(); return; }
  if(act==="voice-settings"){ voiceSettings(); return; }
  if(act==="toggle-stay"){ S.stay=!(S.stay!==false); save(); if(ACC.opts) ACC.opts.stay=S.stay; t.textContent=stayLabel(); return; }
  if(act==="acc-reset"){ accReset(); return; }
  if(act==="acc-weak"){ accWeak(); return; }
  if(act==="free-start"){ if(!DICT && !accAvailable()){ voiceUnavailable(); return; } MODE="voice"; REPS={}; go("read",{kind:"free"}); return; }
  if(act==="play"){ if(PLAYER.playing) stopAudio(); else playIdx(readContext().idx,{}); return; }
  if(act==="audio-settings"){ audioSheet(); return; }
  if(act==="range-listen"){ const r=S.range; MODE="read"; REPS={}; go("read",{kind:"range",s:r.s,a:r.a,b:r.b}); playIdx(readContext().idx,{}); return; }
  if(act==="voice-hint"){ VOICE.hints.add(VOICE.p); voiceUpdate(); return; }
  if(act==="voice-reset"){ stopDict(); VOICE.finals=""; VOICE.partial=""; VOICE.hints=new Set(); VOICE.ended=false; VOICE.skipSpoken=0; VOICE.elseHTML=""; VOICE.elseFrom=null; VOICE.elseTried=null; if(READ&&READ.free){ READ={kind:"free"}; VOICE.key=""; } render(); return; }
  if(act==="voice-show"){ VOICE.showText=!VOICE.showText; const el=$("#ayahs"); if(el) el.classList.toggle("showtext",VOICE.showText); t.textContent=VOICE.showText?"اخفِ النص":"اعرض النص"; return; }
  if(act==="voice-weak"){ const pages=new Set(); VOICE.st.forEach((v,k)=>{ if(v===2) pages.add(A[VOICE.T[k].i][2]); }); for(const p of pages) S.weak[p]=(S.weak[p]||0)+1; save(); toast("سجلت "+pagesWord(pages.size)+" للتثبيت"); return; }
  if(act==="back"){ const k=READ&&READ.kind; READ=null; go(["new","near","far","weak"].includes(k)?"today":"read"); return; }
  if(act.startsWith("range-")){ const r=S.range; const m=act.slice(6); if(m==="voice" && !DICT && !accAvailable()){ voiceUnavailable(); return; } MODE=m; REPS={}; go("read",{kind:"range",s:r.s,a:r.a,b:r.b}); return; }
  if(act==="hub-new"){ go("read",{kind:"new"}); return; }
  if(act==="start-plan"){ S=DRAFT; DRAFT=null; S.started=keyOf(new Date()); MEM=new Uint8Array(N); save(); go("today"); toast("بسم الله، بدت خطتك 🌱"); return; }
  if(act==="open-new"){ go("read",{kind:"new"}); return; }
  if(act.startsWith("open-")){ go("read",{kind:act.slice(5)}); return; }
  if(act==="finish-new"){ finishNew(); return; }
  if(act.startsWith("finish-")||act.startsWith("done-")){ finishReview(act.split("-")[1]); return; }
  if(act==="fs+"||act==="fs-"){ S.qfs=Math.max(18,Math.min(40,S.qfs+(act==="fs+"?2:-2))); document.documentElement.style.setProperty("--qfs",S.qfs+"px"); save(); return; }
  if(act==="link"){ LINK=Math.min(3,LINK+1); const el=$("#linkc"); if(el) el.textContent=AR(LINK); if(LINK===3) toast("ممتاز! المقطع مربوط، اختبر نفسك الحين"); return; }
  if(act==="pg-prev"||act==="pg-next"){ READ.page=Math.max(1,Math.min(604,READ.page+(act==="pg-next"?1:-1))); render(); window.scrollTo(0,0); return; }
  if(act==="toggle-page"){ const p=READ.page; const full=pageState(p)===2; setBits(PAGE[p],!full); save(); render(); toast(full?"شلت العلامة عن صفحة "+p:"علّمت صفحة "+p+" محفوظة"); return; }
  if(act==="mark-sheet"){ markSheet(); return; }
  if(act==="close-sheet"){ closeSheet(); return; }
  if(act==="reset"){ openSheet(`<h3>متأكد تبي تبدأ من الصفر؟</h3><p class="sub">بينمسح كل تقدمك وخطتك. ما تقدر ترجعه.</p><div class="row" style="margin-top:14px"><button class="btn danger" data-act="reset-yes">إيه، امسح كل شي</button><button class="btn ghost" data-act="close-sheet">لا، رجّعني</button></div>`); return; }
  if(act==="reset-yes"){ S=null; MEM=new Uint8Array(N); DRAFT=null; READ=null; REPS={}; save(); closeSheet(); go("plan"); return; }
});
document.addEventListener("change", e=>{
  if(e.target.id==="recSel" && S){ S.reciter=e.target.value; save(); if(PLAYER.playing){ const l=PLAYER.list, k=PLAYER.pos; stopAudio(); playIdx(l.filter(x=>!x.bas).map(x=>x.i),{}); } return; }
  const id=e.target.id; if(!["rS","rA","rB"].includes(id)||!S) return;
  const r=S.range; const v=+e.target.value;
  if(id==="rS"){ r.s=v; r.a=1; r.b=SUR[v-1][1]; }
  if(id==="rA"){ r.a=v; if(r.b<v) r.b=v; }
  if(id==="rB"){ r.b=v; if(r.a>v) r.a=v; }
  save(); renderHub();
});
function refreshAyah(i){ const el=document.querySelector(`.ayah[data-i="${i}"]`); if(!el) return; const tmp=document.createElement("div"); tmp.innerHTML=ayahHTML(i); el.replaceWith(tmp.firstElementChild); }

/* ---------- boot ---------- */
(async function boot(){
  try{
    const res=await fetch("quran.json"); prepare(await res.json());
  }catch(e){ app.innerHTML=`<div class="loading">ما قدرت أحمّل المصحف. حدّث الصفحة وجرّب مرة ثانية.</div>`; return; }
  const loaded=await initStorage();
  if(window.claude && window.claude.use){ window.claude.use("dictation").then(d=>{ if(d){ setupDict(d); if(VIEW==="read"&&!READ) render(); } }).catch(()=>{}); }
  else if(STANDALONE){ const w=webSpeechAdapter(); if(w) setupDict(w); }
  if(loaded && loaded.v){ S=Object.assign(defaults(),JSON.parse(JSON.stringify(loaded))); MEM=unpackBits(S.mem); }
  else { S=null; MEM=new Uint8Array(N); }
  const h=location.hash.slice(1);
  VIEW = S ? (["today","read","progress","plan"].includes(h)?h:"today") : "plan";
  render();
  if(S && store.mode==="db" && store.from==="local") save(); // move a local copy into the account once
})();
</script>
